<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Car Mirror</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { -webkit-user-select: none; user-select: none; touch-action: none; }
  #screen { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #msg, #toast {
    position: fixed; left: 50%; transform: translate(-50%, -50%);
    max-width: 70vw; padding: 20px 28px; border-radius: 14px; pointer-events: none;
    background: rgba(0, 0, 0, .8); color: #f2f2f2; text-align: center;
    font: 500 28px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #msg { top: 50%; }
  #toast { top: 82%; display: none; font-size: 22px; }
  #msg small { display: block; margin-top: 12px; color: #9a9a9a; font-size: 18px; font-weight: 400; }
  #msg .code {
    display: block; margin: 22px 0 8px; color: #fff; letter-spacing: .14em;
    font: 700 72px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  #info {
    position: fixed; left: 16px; bottom: 16px; display: none; pointer-events: none;
    padding: 8px 12px; border-radius: 8px; background: rgba(0, 0, 0, .7); color: #bdbdbd;
    font: 15px/1.3 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  #menu {
    position: fixed; left: 12px; top: 12px; width: 48px; height: 48px; border-radius: 24px;
    background: rgba(255, 255, 255, .14); color: #e6e6e6; opacity: .45;
    font: 700 24px/46px system-ui, sans-serif; text-align: center; cursor: pointer;
  }
  #nav {
    position: fixed; right: 16px; top: 50%; transform: translateY(-50%); display: none;
    flex-direction: column; gap: 18px; transition: opacity .4s;
  }
  #nav.idle { opacity: .3; }
  #nav button {
    width: 72px; height: 72px; padding: 0; border: 0; border-radius: 36px; cursor: pointer;
    background: rgba(255, 255, 255, .16); color: #eee;
  }
  #nav button:active { background: rgba(255, 255, 255, .42); }
  #nav svg {
    display: block; width: 30px; height: 30px; margin: auto; fill: none; stroke: currentColor;
    stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round;
  }
  .touch {
    position: fixed; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%;
    background: rgba(255, 255, 255, .45); pointer-events: none;
    transition: transform .35s ease-out, opacity .35s ease-out;
  }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="msg">Connecting to your phone…</div>
<div id="toast"></div>
<div id="info"></div>
<div id="menu" role="button" aria-label="Show details and go full screen">⋯</div>
<div id="nav" aria-label="Phone buttons">
  <button data-a="back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></button>
  <button data-a="home" aria-label="Home"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></svg></button>
  <button data-a="recents" aria-label="Recent apps"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
</div>
<script src="crypto.js"></script>

      "Show details and go full screen": "Afficher les détails et passer en plein écran",
      "Phone buttons": "Boutons du téléphone",

      "Home": "Accueil",

    },
    "de": {

      "Retrying… Check that mirroring is still on and the car is on the phone’s hotspot.": "Neuer Versuch… Prüfe, ob das Spiegeln noch läuft und das Auto im Hotspot des Handys ist.",

      "Paused on the phone.": "Auf dem Handy pausiert.",

      "Resuming…": "Wird fortgesetzt…",
      "Connected.": "Verbunden.",
      "Waiting for the phone screen…": "Warte auf den Handybildschirm…",
      "Your phone said no.": "Dein Handy hat abgelehnt.",
      "Reload this page to ask again.": "Lade diese Seite neu, um erneut zu fragen.",
      "Your phone didn’t answer in time.": "Dein Handy hat nicht rechtzeitig geantwortet.",
      "The phone isn’t taking pairing requests right now.": "Das Handy nimmt gerade keine Kopplungsanfragen an.",
      "Trying again shortly…": "Neuer Versuch in Kürze…",
      "Touch control is off. Turn it on in Car Mirror on your phone.": "Die Touch-Steuerung ist aus. Schalte sie in Car Mirror auf deinem Handy ein.",
      "This browser can’t show your phone securely.": "Dieser Browser kann dein Handy nicht sicher anzeigen.",
      "Open this address in the car’s own browser.": "Öffne diese Adresse im Browser des Autos.",
      "Show details and go full screen": "Details zeigen und Vollbild",
      "Phone buttons": "Handy-Tasten",
      "Back": "Zurück",
      "Home": "Startbildschirm",
      "Recent apps": "Letzte Apps"
    }
  };
  var words = WORDS[String(navigator.language || 'en').slice(0, 2).toLowerCase()] || {};
  function t(text) { return (text && words[text]) || text; }
  Array.prototype.forEach.call(document.querySelectorAll('[aria-label]'), function (el) {
    el.setAttribute('aria-label', t(el.getAttribute('aria-label')));
  });
  msg.textContent = t(msg.textContent);

  var bitmap = null;        // last decoded frame, kept for redraws on resize
  var drawn = null;         // where the last frame went: { rect (screen, CSS px), src (frame px), fw, fh }
  var paused = '';          // '' while live, otherwise why the phone is withholding the picture
  var failures = 0;
  var framesThisSecond = 0;
  var fps = 0;
  var phone = { touch: false, quality: 0 };
  var forced = (location.search.match(/[?&]mode=(\w+)/) || [])[1] || '';
  var mode = forced === 'poll' ? 'poll' : 'stream';

  function show(text, detail, code) {
    msg.textContent = t(text) || '';
    if (code) {
      var digits = document.createElement('span');
      digits.className = 'code';
      digits.textContent = code;
      msg.appendChild(digits);
    }
    if (detail) {
      var small = document.createElement('small');
      small.textContent = t(detail);
      msg.appendChild(small);
    }
    msg.style.display = text ? 'block' : 'none';
  }

  var toastTimer = 0;
  function flash(text) {
    toast.textContent = t(text);
    toast.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.style.display = 'none'; }, 3500);
  }

  function lostConnection() {
    show('Lost the connection to your phone.',
      'Retrying… Check that mirroring is still on and the car is on the phone’s hotspot.');
  }

  // ---- Pairing and the encrypted session (Pairing.kt on the phone has the full story) ----
  //
  // The phone shows nothing to a screen it hasn't been told to trust. The first time, both
  // show the same 6-digit code and the user taps Allow on the phone; this page then keeps a
  // pair key in local storage. Each visit opens a session from it, and from then on frames,
  // status and taps are encrypted (ChaCha20-Poly1305) with keys only this page and the phone
  // have. crypto.js, served by the phone, provides the primitives: plain http pages get no
  // crypto.subtle from the browser.

  var C = window.CarCrypto;
  var encoder = typeof TextEncoder === 'function' ? new TextEncoder() : null;
  var PAIR_STORAGE = 'carMirrorPair';
  var pair = null;        // { id, key }: this screen's pairing with the phone
  var sess = null;        // { id, down, up, sent }: the open session
  var connecting = null;  // the handshake in progress, so only one runs at a time

  function utf8(text) { return encoder.encode(text); }

  function concat() {
    var n = 0, i, off = 0;
    for (i = 0; i < arguments.length; i++) n += arguments[i].length;
    var out = new Uint8Array(n);
    for (i = 0; i < arguments.length; i++) { out.set(arguments[i], off); off += arguments[i].length; }
    return out;
  }

  function b64(bytes) {
    var s = '';
    for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function unb64(text) {
    text = String(text).replace(/-/g, '+').replace(/_/g, '/');
    while (text.length % 4) text += '=';
    var s = atob(text), out = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  }

  // Messages are an 8-byte big-endian counter, then ciphertext; the counter is the nonce.
  function nonceFor(counter) { var n = new Uint8Array(12); n.set(counter, 4); return n; }

  function counterOf(message) {
    var v = new DataView(message.buffer, message.byteOffset, 8);
    return v.getUint32(0) * 4294967296 + v.getUint32(4);
  }

  function counterBytes(n) {
    var out = new Uint8Array(8), v = new DataView(out.buffer);
    v.setUint32(0, Math.floor(n / 4294967296));
    v.setUint32(4, n >>> 0);
    return out;
  }

  // Throws if the message was altered or isn't from this session.
  function openFromPhone(s, aad, message) {
    return C.open(s.down, nonceFor(message.subarray(0, 8)), aad, message.subarray(8));
  }

  function sealForPhone(s, aad, plaintext) {
    s.sent += 1;
    var counter = counterBytes(s.sent);
    return concat(counter, C.seal(s.up, nonceFor(counter), aad, plaintext));
  }

  function HttpError(status) { this.status = status; }
  function PairingRefused(state) { this.state = state; }

  function post(path, form) {
    var body = Object.keys(form).map(function (k) { return k + '=' + form[k]; }).join('&');
    return fetch(path, { method: 'POST', cache: 'no-store', headers: { 'Content-Type': 'text/plain' }, body: body })
      .then(function (r) { if (!r.ok) throw new HttpError(r.status); return r.json(); });
  }

  function loadPair() {
    try {
      var v = JSON.parse(localStorage.getItem(PAIR_STORAGE) || 'null');
      if (v && v.id && v.key) return { id: v.id, key: unb64(v.key) };
    } catch (e) { /* no storage: pair for this visit only */ }
    return null;
  }

  function savePair(p) {
    try { localStorage.setItem(PAIR_STORAGE, JSON.stringify({ id: p.id, key: b64(p.key) })); } catch (e) {}
  }

  function forgetPair() {
    pair = null;
    try { localStorage.removeItem(PAIR_STORAGE); } catch (e) {}
  }

  // The 6 digits both screens show: from SHA-256 of both public keys, the phone's first.
  function pairingCode(phoneKey, carKey) {
    var h = C.sha256(concat(utf8('car-mirror code v1'), phoneKey, carKey));
    var n = h[0] * 16777216 + (h[1] << 16) + (h[2] << 8) + h[3];
    var digits = String(n % 1000000);
    while (digits.length < 6) digits = '0' + digits;
    return digits;
  }

  // Waits for the user's answer on the phone; the phone holds each request up to 25 s.
  function answer(id, state) {
    return fetch('pair/wait?id=' + id + '&state=' + state, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new HttpError(r.status); return r.json(); })
      .then(function (r) { return r.state === state ? answer(id, state) : r.state; }, function () {
        return new Promise(function (ok) { setTimeout(ok, 1000); }).then(function () { return answer(id, state); });
      });
  }

  // Commit to a key first, so a device in the middle can't pick keys that make the codes match.
  function pairWithPhone() {
    var mine = C.keyPair();
    show('Pairing with your phone…');
    var commitment = C.sha256(concat(utf8('car-mirror commit v1'), mine.publicKey));
    return post('pair/start', { c: b64(commitment) }).then(function (started) {
      var phoneKey = unb64(started.pub);
      return post('pair/finish', { id: started.id, pub: b64(mine.publicKey) }).then(function () {
        var digits = pairingCode(phoneKey, mine.publicKey);
        show('Pair this screen with your phone',
          'Check that your phone shows the same code, then tap Allow there.', digits.slice(0, 3) + ' ' + digits.slice(3));
        return answer(started.id, 'waiting');
      }).then(function (state) {
        if (state !== 'approved') throw new PairingRefused(state);
        var shared = C.sharedSecret(mine.secretKey, phoneKey);
        pair = { id: started.id, key: C.hkdf(shared, concat(phoneKey, mine.publicKey), utf8('car-mirror pair key v1'), 32) };
        savePair(pair);
        show('Paired.', 'Connecting…');
      });
    });
  }

  function openSession() {
    var mine = C.keyPair();
    return post('session/start', { pair: pair.id, pub: b64(mine.publicKey) }).then(function (challenge) {
      var phoneKey = unb64(challenge.pub), nonce = unb64(challenge.nonce);
      var proof = C.hmac(pair.key, concat(utf8('car-mirror proof v1'), nonce, mine.publicKey, phoneKey));
      return post('session/finish', { pair: pair.id, pub: b64(mine.publicKey), proof: b64(proof) }).then(function (opened) {
        var shared = C.sharedSecret(mine.secretKey, phoneKey);
        var keys = C.hkdf(concat(shared, pair.key), nonce, concat(utf8('car-mirror session v1'), mine.publicKey, phoneKey), 64);
        sess = { id: opened.session, down: keys.slice(0, 32), up: keys.slice(32, 64), sent: 0 };
      });
    });
  }

  // Pairs if needed, then opens a session. If the phone no longer knows this screen (it was
  // forgotten on the phone), pairing starts over.
  function connect() {
    if (sess) return Promise.resolve();
    if (connecting) return connecting;
    if (!pair) pair = loadPair();
    var attempt = (pair ? Promise.resolve() : pairWithPhone()).then(openSession).catch(function (e) {
      if (pair && e instanceof HttpError && (e.status === 404 || e.status === 403)) {
        forgetPair();
        return pairWithPhone().then(openSession);
      }
      throw e;
    });
    connecting = attempt.then(function () { connecting = null; refreshStatus(); },
      function (e) { connecting = null; throw e; });
    return connecting;
  }

  // ---- Drawing, with black bars around a video trimmed off ----

  function fitCanvas() {
    var ratio = window.devicePixelRatio || 1;
    var w = Math.round(window.innerWidth * ratio);
    var h = Math.round(window.innerHeight * ratio);
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      draw();
    }
  }

  function draw() {
    var cw = canvas.width, ch = canvas.height;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, cw, ch);
    if (!bitmap) { drawn = null; return; }
    var src = crop || { x: 0, y: 0, w: bitmap.width, h: bitmap.height };
    var scale = Math.min(cw / src.w, ch / src.h);
    var w = Math.round(src.w * scale), h = Math.round(src.h * scale);
    var x = Math.round((cw - w) / 2), y = Math.round((ch - h) / 2);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(bitmap, src.x, src.y, src.w, src.h, x, y, w, h);
    var ratio = cw / canvas.clientWidth || 1;
    drawn = { rect: { x: x / ratio, y: y / ratio, w: w / ratio, h: h / ratio }, src: src, fw: bitmap.width, fh: bitmap.height };
  }

  // A video played full screen on a phone is surrounded by black bars, because a phone is
  // longer than the video. Those bars are part of the mirrored picture, so the video would
  // sit small in the middle of the car's screen. Find them and draw only what is inside.
  //
  // Real bars hold still and come in matching pairs; a dark scene does neither. So bars are
  // trimmed only when they are symmetrical and have held for a few seconds, and the picture
  // grows back the moment anything appears in them.
  var crop = null, candidate = null, votes = 0, lastProbe = 0, cropFor = '';
  var probe = document.createElement('canvas');
  var probeCtx = probe.getContext('2d', { willReadFrequently: true });

  function sameBox(a, b, fw, fh) {
    if (!a || !b) return a === b;
    return Math.abs(a.x - b.x) <= fw * 0.02 && Math.abs(a.w - b.w) <= fw * 0.02 &&
      Math.abs(a.y - b.y) <= fh * 0.02 && Math.abs(a.h - b.h) <= fh * 0.02;
  }

  function findBars(bmp) {
    var now = performance.now();
    var size = bmp.width + 'x' + bmp.height;
    if (size !== cropFor) { cropFor = size; crop = null; candidate = null; votes = 0; }
    if (now - lastProbe < 500) return;
    lastProbe = now;
    var pw = 160, ph = Math.max(1, Math.round(pw * bmp.height / bmp.width));
    probe.width = pw;
    probe.height = ph;
    probeCtx.drawImage(bmp, 0, 0, pw, ph);
    var d = probeCtx.getImageData(0, 0, pw, ph).data;
    var top = -1, bottom = -1, left = pw, right = -1;
    for (var y = 0; y < ph; y++) {
      for (var x = 0; x < pw; x++) {
        var i = (y * pw + x) * 4;
        if (d[i] + d[i + 1] + d[i + 2] > 84) {
          if (top < 0) top = y;
          bottom = y;
          if (x < left) left = x;
          if (x > right) right = x;
        }
      }
    }
    if (top < 0) return; // an all-dark frame tells us nothing; keep what we have
    var sx = bmp.width / pw, sy = bmp.height / ph;
    var box = { x: Math.max(0, (left - 1) * sx), y: Math.max(0, (top - 1) * sy) };
    box.w = Math.min(bmp.width, (right + 2) * sx) - box.x;
    box.h = Math.min(bmp.height, (bottom + 2) * sy) - box.y;
    var leftBar = box.x, rightBar = bmp.width - box.x - box.w;
    var topBar = box.y, bottomBar = bmp.height - box.y - box.h;
    var symmetric = Math.abs(leftBar - rightBar) <= bmp.width * 0.03 && Math.abs(topBar - bottomBar) <= bmp.height * 0.03;
    var worthIt = box.w < bmp.width * 0.94 || box.h < bmp.height * 0.94;
    var sane = box.w > bmp.width * 0.4 && box.h > bmp.height * 0.4;
    var next = symmetric && worthIt && sane ? box : null;

    if (crop && (box.x < crop.x - sx || box.y < crop.y - sy ||
        box.x + box.w > crop.x + crop.w + sx || box.y + box.h > crop.y + crop.h + sy)) {
      crop = null; // something appeared in the bars: show the whole screen again, at once
    }
    if (sameBox(next, candidate, bmp.width, bmp.height)) votes++;
    else { candidate = next; votes = 1; }
    if (candidate && votes >= 6 && !sameBox(crop, candidate, bmp.width, bmp.height)) crop = candidate;
    if (!candidate && votes >= 2) crop = null;
  }

  function updateInfo() {
    if (info.style.display !== 'block') return;
    var parts = [bitmap ? bitmap.width + '×' + bitmap.height : 'no frame yet', fps + ' fps'];
    if (phone.quality) parts.push('quality ' + phone.quality);
    parts.push(phone.touch ? 'touch on' : 'touch off');
    parts.push(mode);
    parts.push('encrypted');
    if (crop) parts.push('bars trimmed');
    parts.push(location.host);
    info.textContent = parts.join(' · ');
  }

  setInterval(function () {
    fps = framesThisSecond;
    framesThisSecond = 0;
    updateInfo();
  }, 1000);

  // ---- What the phone allows: touch, current quality ----

  function refreshStatus() {
    if (!sess) return;
    var current = sess;
    fetch('status?s=' + current.id, { cache: 'no-store' }).then(function (r) {
      if (r.status === 401) { if (sess === current) sess = null; throw new Error('session ended'); }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.arrayBuffer();
    }).then(function (buffer) {
      var s = JSON.parse(decoder.decode(openFromPhone(current, utf8('status'), new Uint8Array(buffer))));
      phone.touch = !!s.touch;
      updateNav();
      phone.quality = s.jpegQuality || 0;
      updateInfo();
    }).catch(function () {});
  }

  // ---- Pause ----

  function setPaused(reason) {
    if (reason === paused) return;
    paused = reason;
    updateNav();
    if (paused) {
      // Drop the last picture: whatever the phone is hiding must not stay on the car's screen.
      if (bitmap && bitmap.close) bitmap.close();
      bitmap = null;
      pending = null;
      draw();
      if (paused === 'driving') show('Paused while the car is moving.', 'The picture comes back when you stop.');
      else if (paused === 'locked') show('The phone is locked.', 'Unlock it to bring the picture back.');
      else if (paused === 'hot') show('The phone is too hot.', 'The picture comes back when it has cooled down.');
      else show('Paused on the phone.', 'Tap Resume on the phone to continue.');
    } else {
      show(bitmap ? '' : 'Resuming…');
    }
  }

  // ---- Decoding: always the newest frame, never a queue ----

  var pending = null, decoding = false;

  function decodeNewest() {
    if (decoding || !pending) return;
    var blob = pending;
    pending = null;
    decoding = true;
    createImageBitmap(blob).then(function (decoded) {
      if (paused) { if (decoded.close) decoded.close(); return; }
      if (bitmap && bitmap.close) bitmap.close();
      bitmap = decoded;
      findBars(bitmap);
      draw();
      framesThisSecond++;
      show('');
    }, function () { /* a bad frame: skip it */ }).then(function () {
      decoding = false;
      decodeNewest();
    });
  }

  // ---- Frames, pushed by the phone over one long response ----
  //
  // Records: a type byte, a 4-byte big-endian length, then a message sealed for the session
  // with the type byte as associated data. Decrypted:
  //   1 frame  (seq u64, width u16, height u16, JPEG)   2 pause state (UTF-8)   3 ping (empty)

  function ByteQueue() { this.chunks = []; this.length = 0; }
  ByteQueue.prototype.push = function (chunk) { this.chunks.push(chunk); this.length += chunk.length; };
  ByteQueue.prototype.read = function (n, keep) {
    var out = new Uint8Array(n), off = 0, i = 0, rest = this.chunks.slice();
    while (off < n) {
      var c = rest[i], k = Math.min(c.length, n - off);
      out.set(c.subarray(0, k), off);
      off += k;
      if (k === c.length) i++; else rest[i] = c.subarray(k);
    }
    if (!keep) { this.chunks = rest.slice(i); this.length -= n; }
    return out;
  };

  var decoder = typeof TextDecoder === 'function' ? new TextDecoder() : null;
  var seq = 0;

  // Throws when a record doesn't decrypt: the connection is dropped and a new session opened.
  function onRecord(s, type, sealed, order) {
    if (order) {
      var counter = counterOf(sealed);
      if (counter <= order.last) throw new Error('out of order');   // a replayed record
      order.last = counter;
    }
    var payload = openFromPhone(s, new Uint8Array([type]), sealed);
    if (type === 1) {
      var v = new DataView(payload.buffer, payload.byteOffset, 12);
      seq = v.getUint32(0) * 4294967296 + v.getUint32(4);
      pending = new Blob([payload.subarray(12)], { type: 'image/jpeg' });
      decodeNewest();
    } else if (type === 2) {
      setPaused(decoder.decode(payload));
    }
  }

  var streamAbort = null, lastData = 0;

  function streamLoop() {
    var controller = new AbortController(), current = sess, order = { last: 0 };
    streamAbort = controller;
    lastData = Date.now();
    fetch('frames?s=' + current.id + '&paused=' + encodeURIComponent(paused), { cache: 'no-store', signal: controller.signal })
      .then(function (response) {
        if (response.status === 401) { if (sess === current) sess = null; throw new Error('session ended'); }
        if (!response.ok) throw new Error('HTTP ' + response.status);
        if (!response.body || !response.body.getReader) { mode = 'poll'; throw new Error('no streaming'); }
        var reader = response.body.getReader(), queue = new ByteQueue();
        if (!bitmap && !paused) show('Connected.', 'Waiting for the phone screen…');
        function pump() {
          return reader.read().then(function (part) {
            if (part.done) throw new Error('stream ended');
            lastData = Date.now();
            if (failures >= 3) refreshStatus(); // back after an outage: the phone may have restarted
            failures = 0;
            queue.push(part.value);
            while (queue.length >= 5) {
              var head = queue.read(5, true);
              var length = ((head[1] << 24) | (head[2] << 16) | (head[3] << 8) | head[4]) >>> 0;
              if (queue.length < 5 + length) break;
              queue.read(5);
              try {
                onRecord(current, head[0], queue.read(length), order);
              } catch (e) {
                if (sess === current) sess = null;
                controller.abort();
                throw e;
              }
            }
            return pump();
          });
        }
        return pump();
      })
      .catch(function () {
        streamAbort = null;
        retry();
      });
  }

  // The phone pings every 2 s when there is nothing else to send; silence means it is gone.
  setInterval(function () {
    if (streamAbort && Date.now() - lastData > 7000) streamAbort.abort();
  }, 2000);

  // ---- Fallback: ask for one frame at a time (browsers that can't read a stream) ----

  var POLL_TIMEOUT_MS = 15000; // the phone answers within 10 s; anything longer is a dead connection

  function pollOnce() {
    var current = sess;
    var controller = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = controller ? setTimeout(function () { controller.abort(); }, POLL_TIMEOUT_MS) : 0;
    return fetch('frame?s=' + current.id + '&after=' + seq + '&paused=' + encodeURIComponent(paused), {
      cache: 'no-store',
      signal: controller ? controller.signal : undefined
    }).then(function (response) {
      if (response.status === 401) { if (sess === current) sess = null; throw new Error('session ended'); }
      if (!response.ok) throw new Error('HTTP ' + response.status);
      return response.arrayBuffer();
    }).then(function (buffer) {
      if (timer) clearTimeout(timer);
      var bytes = new Uint8Array(buffer);
      var length = ((bytes[1] << 24) | (bytes[2] << 16) | (bytes[3] << 8) | bytes[4]) >>> 0;
      if (failures >= 3) refreshStatus();
      failures = 0;
      try {
        onRecord(current, bytes[0], bytes.subarray(5, 5 + length), null);
      } catch (e) {
        if (sess === current) sess = null;
        throw e;
      }
      if (bytes[0] !== 1 && !bitmap && !paused) show('Connected.', 'Waiting for the phone screen…');
    }, function (err) {
      if (timer) clearTimeout(timer);
      throw err;
    });
  }

  function pollLoop() {
    pollOnce().then(pollLoop, retry);
  }

  // After any failure: back off, reconnect (pairing or a new session if needed), resume.
  function retry() {
    failures++;
    if (failures >= 3) lostConnection();
    setTimeout(run, Math.min(3000, 250 * failures));
  }

  function run() {
    connect().then(function () {
      if (mode === 'poll') pollLoop(); else streamLoop();
    }, function (e) {
      if (e instanceof PairingRefused) {
        if (e.state === 'denied') show('Your phone said no.', 'Reload this page to ask again.');
        else show('Your phone didn’t answer in time.', 'Reload this page to ask again.');
        return;
      }
      if (e instanceof HttpError && e.status === 429) {
        show('The phone isn’t taking pairing requests right now.', 'Trying again shortly…');
        setTimeout(run, 10000);
        return;
      }
      retry();
    });
  }

  // ---- Details and full screen ----

  function goFullScreen() {
    var root = document.documentElement;
    if (!document.fullscreenElement && root.requestFullscreen) {
      var request = root.requestFullscreen();
      if (request && request.catch) request.catch(function () {});
    }
  }

  function toggleDetails() {
    info.style.display = info.style.display === 'block' ? 'none' : 'block';
    updateInfo();
    goFullScreen();
  }

  menu.addEventListener('click', function (e) {
    e.stopPropagation();
    toggleDetails();
  });

  // ---- Touch: taps, swipes and two-finger gestures on the picture are performed on the phone ----

  var fingers = null; // the fingers down right now: { start, order: [pointerId], strokes: { id: { points, last, up } } }

  // Where (clientX, clientY) falls on the phone's screen, as fractions of the whole screen
  // (trimmed bars included). Null when outside the picture, unless clamp is set: a swipe
  // may run past the edge.
  function onPicture(clientX, clientY, clamp) {
    if (!drawn) return null;
    var r = drawn.rect;
    var u = (clientX - r.x) / r.w, v = (clientY - r.y) / r.h;
    if (!clamp && (u < 0 || u > 1 || v < 0 || v > 1)) return null;
    u = Math.min(1, Math.max(0, u));
    v = Math.min(1, Math.max(0, v));
    return [(drawn.src.x + u * drawn.src.w) / drawn.fw, (drawn.src.y + v * drawn.src.h) / drawn.fh];
  }

  function ripple(clientX, clientY) {
    var dot = document.createElement('div');
    dot.className = 'touch';
    dot.style.left = clientX + 'px';
    dot.style.top = clientY + 'px';
    document.body.appendChild(dot);
    requestAnimationFrame(function () {
      dot.style.transform = 'scale(1.8)';
      dot.style.opacity = '0';
    });
    setTimeout(function () { dot.remove(); }, 400);
  }

  // How far a finger strayed from where it landed, in screen pixels.
  function travel(points) {
    var pxX = drawn.fw * drawn.rect.w / drawn.src.w, pxY = drawn.fh * drawn.rect.h / drawn.src.h;
    var x0 = points[0][0], y0 = points[0][1], far = 0;
    for (var i = 1; i < points.length; i++) {
      far = Math.max(far, Math.hypot((points[i][0] - x0) * pxX, (points[i][1] - y0) * pxY));
    }
    return far;
  }

  function sample(points, most) {
    var step = Math.ceil(points.length / most);
    return points.filter(function (p, i) { return i % step === 0 || i === points.length - 1; });
  }

  function path(points) {
    return points.map(function (p) { return p[0].toFixed(4) + ',' + p[1].toFixed(4); }).join(';');
  }

  // Finished fingers as the phone expects them: `d=<ms>&p=x,y;x,y;...`, a second finger's
  // path after a `|`. One finger barely moving is a tap (or a long press if held); anything
  // else is a swipe, or with two fingers a pinch or two-finger scroll, along sampled points.
  function gestureBody(strokes, ms) {
    var still = strokes.every(function (points) { return travel(points) < 12; });
    var duration, paths;
    if (still) {
      duration = strokes.length === 1 && ms >= 450 ? Math.min(ms, 1500) : 60;
      paths = strokes.map(function (points) { return [points[0]]; });
    } else {
      duration = Math.max(100, Math.min(ms, 3000));
      paths = strokes.map(function (points) { return sample(points, strokes.length === 1 ? 60 : 32); });
    }
    return 'd=' + Math.round(duration) + '&p=' + paths.map(path).join('|');
  }

  // One at a time, so each message's counter reaches the phone in order (it refuses any
  // counter lower than the last it accepted).
  var inputQueue = Promise.resolve();

  function sendInput(text) {
    var current = sess;
    if (!current) return;
    inputQueue = inputQueue.then(function () {
      if (sess !== current) return;
      return fetch('input', {
        method: 'POST',
        cache: 'no-store',
        headers: { 'Content-Type': 'application/octet-stream', 'X-Car-Mirror-Session': current.id },
        body: sealForPhone(current, utf8('input'), utf8(text))
      }).then(function (r) {
        if (r.status === 401) { if (sess === current) sess = null; }
        else if (r.status === 403 || r.status === 409) refreshStatus(); // touch was turned off, or the like
      });
    }).catch(function () {});
  }

  // ---- Back, Home and Recent apps: shown while touch control works, dimmed when idle ----

  var navIdle = 0;

  function updateNav() {
    nav.style.display = phone.touch && sess && !paused ? 'flex' : 'none';
  }

  function wakeNav() {
    nav.classList.remove('idle');
    clearTimeout(navIdle);
    navIdle = setTimeout(function () { nav.classList.add('idle'); }, 5000);
  }

  nav.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
  nav.addEventListener('click', function (e) {
    var button = e.target.closest('button');
    if (!button) return;
    e.stopPropagation();
    wakeNav();
    sendInput('a=' + button.getAttribute('data-a'));
  });

  var askedFullScreen = false;

  canvas.addEventListener('pointerdown', function (e) {
    if (!askedFullScreen) { askedFullScreen = true; goFullScreen(); } // needs a tap; the first one will do
    wakeNav();
    if (fingers) {                                  // a second finger joining the first
      if (fingers.order.length >= 2 || paused) return;
      var q = onPicture(e.clientX, e.clientY, true);
      if (!q) return;
      e.preventDefault();
      fingers.strokes[e.pointerId] = { points: [q], last: e.timeStamp, up: false };
      fingers.order.push(e.pointerId);
      if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
      ripple(e.clientX, e.clientY);
      return;
    }
    var p = onPicture(e.clientX, e.clientY, false);
    if (!p) { toggleDetails(); return; }           // the black area around the picture
    if (paused) return;
    if (!phone.touch || !sess) {
      flash('Touch control is off. Turn it on in Car Mirror on your phone.');
      return;
    }
    e.preventDefault();
    fingers = { start: e.timeStamp, order: [e.pointerId], strokes: {} };
    fingers.strokes[e.pointerId] = { points: [p], last: e.timeStamp, up: false };
    if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
    ripple(e.clientX, e.clientY);
  });

  canvas.addEventListener('pointermove', function (e) {
    var s = fingers && fingers.strokes[e.pointerId];
    if (!s || s.up || e.timeStamp - s.last < 16) return;
    s.points.push(onPicture(e.clientX, e.clientY, true));
    s.last = e.timeStamp;
  });

  function endStroke(e, cancelled) {
    var s = fingers && fingers.strokes[e.pointerId];
    if (!s || s.up) return;
    if (cancelled || !drawn) { fingers = null; return; }
    s.points.push(onPicture(e.clientX, e.clientY, true));
    s.up = true;
    var done = fingers.order.every(function (id) { return fingers.strokes[id].up; });
    if (!done) return;                             // wait for the other finger
    var finished = fingers;
    fingers = null;
    sendInput(gestureBody(finished.order.map(function (id) { return finished.strokes[id].points; }),
      e.timeStamp - finished.start));
  }

  canvas.addEventListener('pointerup', function (e) { endStroke(e, false); });
  canvas.addEventListener('pointercancel', function (e) { endStroke(e, true); });

  // ---- Start ----

  if (typeof fetch !== 'function' || typeof createImageBitmap !== 'function' || !C || !encoder || !decoder) {
    show('This browser can’t show your phone securely.', 'Open this address in the car’s own browser.');
  } else {
    window.addEventListener('resize', fitCanvas);
    fitCanvas();
    setInterval(refreshStatus, 5000);
    if (typeof AbortController !== 'function') mode = 'poll';
    run();
  }
})();
</script>
</body>
</html>
