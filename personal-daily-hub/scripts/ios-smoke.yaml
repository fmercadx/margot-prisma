# The Maestro flow scripts/ios_smoke.py runs in the iOS Simulator.
# Adds a note, closes the app, opens it again and expects the note back:
# storage, the Keychain key and decryption all working on iOS. Screenshots
# land in the folder ios_smoke.py passes as --test-output-dir.
appId: com.fmercadx.personaldailyhub
---
- launchApp
- extendedWaitUntil:
    visible: "Quick Capture"
    timeout: 120000
- takeScreenshot: 1-home
- tapOn:
    id: "note-input"
- inputText: "Simulator check"
- tapOn:
    id: "note-submit"
- assertVisible: "Simulator check"
- takeScreenshot: 2-note
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Simulator check"
    timeout: 120000
- takeScreenshot: 3-restarted
