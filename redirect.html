<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Margot Trim N Trends has moved</title>
<!--
  The salon site used to live at the root of this Pages deploy. It now has its
  own repository, which means its own /<repo>/ path — so every link anyone
  already has to fmercadx.github.io/margot-prisma/ would otherwise 404.

  deploy.yml copies this to dist/index.html. The meta refresh does the work;
  the visible text is for anyone whose browser or reader ignores it, and the
  canonical link tells search engines where the site actually lives now.
-->
<link rel="canonical" href="https://fmercadx.github.io/margot-trim-n-trends/">
<meta http-equiv="refresh" content="0; url=https://fmercadx.github.io/margot-trim-n-trends/">
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;
    background:#f7f8f6;color:#161a17;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    line-height:1.6;padding:2rem}
  @media (prefers-color-scheme:dark){
    body{background:#101310;color:#e8ebe7}
    a{color:#7fc4a6}
  }
  main{max-width:28rem;text-align:center}
  h1{font-family:"Iowan Old Style",Palatino,Georgia,serif;
    font-size:1.5rem;font-weight:600;margin:0 0 .5rem;letter-spacing:-.015em}
  p{margin:.6em 0;color:inherit}
  a{color:#1f4d3d}
</style>
</head>
<body>
<main>
  <h1>Margot Trim N Trends has moved</h1>

  <p><a href="https://fmercadx.github.io/margot-trim-n-trends/">fmercadx.github.io/margot-trim-n-trends</a></p>
</main>
</body>
