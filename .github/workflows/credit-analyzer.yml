name: credit-analyzer tests

# Path-filtered so this never fires on salon-site changes, and entirely
# independent of the Pages deploy (which builds `dist` from `main`).
on:
  pull_request:
    paths:
      - 'credit-analyzer/**'
      - '.github/workflows/credit-analyzer.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'credit-analyzer/**'
      - '.github/workflows/credit-analyzer.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: credit-analyzer-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: credit-analyzer

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor the code targets; 3.13 catches deprecations early.
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: credit-analyzer/requirements.txt

      - run: pip install -r requirements.txt

      - name: Run tests
        env:
          ANALYZER_PASSWORD: ci-test-password-1234
          ANALYZER_SECURE_COOKIE: '0'
        run: python -m pytest test_analyzer.py web/test_web.py -q

      - name: Analyze the synthetic MISMO fixture end to end
        run: python analyze.py fixtures/synthetic_mismo.xml --score 620 --all

      - name: Render a report from the synthetic fixture
        run: |
          python analyze.py fixtures/synthetic_mismo.xml \
            --score 620 --report /tmp/report.html --file-ref CI-SMOKE

      - name: Fail if any rule crashed
        # run() catches rule exceptions so one bad rule cannot kill an analysis.
        # That means a bug becomes a missing finding rather than a traceback —
        # invisible unless something checks for it here.
        run: |
          set -o pipefail   # otherwise tee's exit status masks a crash
          python analyze.py fixtures/synthetic_mismo.xml --all \
            | tee /tmp/out.txt
          if grep -q "RULE_ERROR" /tmp/out.txt; then
            echo "::error::A rule raised an exception; see RULE_ERROR findings above."
            exit 1
          fi

      - name: Fail if a consumer report was committed
        # fixtures/ is gitignored, but a --force or a rename could slip one in.
        # Git history is permanent, so this is worth a hard gate on every PR.
        working-directory: .
        run: |
          leaked=$(git ls-files -- 'credit-analyzer/fixtures/**' \
            | grep -viE 'synthetic_[^/]*\.(xml|txt)$' || true)
          if [ -n "$leaked" ]; then
            echo "::error::Non-synthetic files are tracked under fixtures/:"
            echo "$leaked"
            exit 1
          fi

  # The browser build is the thing that actually gets deployed, and none of the
  # tests above touch it: they run the analyzer under CPython, not compiled to
  # WebAssembly and unpacked into a virtual filesystem. This job builds it the
  # way the Pages deploy builds it and then drives it in a real Chromium.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Pyodide and the salon-site toolchain
        working-directory: .
        run: npm ci

      - name: Build the browser bundle
        working-directory: .
        run: npm run build:analyzer

      - name: Install Playwright Chromium
        run: pip install playwright && python -m playwright install --with-deps chromium

      - name: Analyze the synthetic fixture inside a browser
        working-directory: .
        run: python credit-analyzer/browser/smoke.py --dist dist/analyzer

      # The mobile bundle is the same engine behind a different shell. The
      # shell is where the subscription gate lives, so it gets its own gate.
      #
      # working-directory is set explicitly on every step in this job: the
      # workflow defaults it to credit-analyzer/, and a step that forgets to
      # override it resolves repo-root paths one level too deep.
      - name: Install Capacitor
        working-directory: credit-analyzer/mobile
        run: npm ci

      - name: Build the mobile bundle
        working-directory: credit-analyzer/mobile
        run: npm run build

      - name: Drive the native shell against a stubbed Capacitor bridge
        working-directory: .
        run: python credit-analyzer/mobile/smoke_native.py
