name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: npm ci
      - run: npm run build

      # The credit analyzer ships as a second, self-contained page under
      # dist/analyzer. It runs Python in WebAssembly rather than on a server,
      # so Pages can host it — but the runtime has to be assembled here,
      # because Vite knows nothing about it. Runs after `npm run build`:
      # Vite clears dist, so building it first would delete it.
      - run: npm run build:analyzer

      # The takeoff counter is a third self-contained page, under dist/takeoff,
      # built the same way: Python in WebAssembly, every file same-origin. Its
      # numpy and cryptography wheels come from the Pyodide CDN at build time,
      # checked against pyodide-lock.json; nothing is fetched at run time.
      - run: npm run build:takeoff

      # The adult foster home site is a fourth page, under dist/shepherds-whisper.
      # Its real home is Railway, which runs its server and so has a working tour
      # form; the Pages copy is static, so that endpoint is absent and the form
      # falls back to a prefilled email. The script handles the subpath base and
      # writes privacy/index.html, since Pages has no SPA fallback.
      - run: npm run build:whisper

      # The plan takeoff tool is a fifth page, under dist/plan-takeoff. It has its
      # own package.json, and its Vite config writes into this dist/ directly.
      # Same ordering rule as the analyzer: after `npm run build`.
      - run: npm ci
        working-directory: plan-takeoff
      - run: npm run build
        working-directory: plan-takeoff

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
