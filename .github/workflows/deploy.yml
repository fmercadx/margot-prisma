name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Only Pyodide comes from npm now — the salon site that used to build
      # into the root of this artifact lives in its own repository.
      - run: npm ci

      - run: npm run build:analyzer

      # Anyone who already has a link to the old salon address lands on the
      # root of this deploy. Send them to where the site actually is rather
      # than to a 404.
      - name: Leave a redirect at the old salon address
        run: cp redirect.html dist/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
