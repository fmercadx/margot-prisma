name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: npm ci
      - run: npm run build

      # The credit analyzer ships as a second, self-contained page under
      # dist/analyzer. It runs Python in WebAssembly rather than on a server,
      # so Pages can host it — but the runtime has to be assembled here,
      # because Vite knows nothing about it. Runs after `npm run build`:
      # Vite clears dist, so building it first would delete it.
      - run: npm run build:analyzer

      # The plan takeoff tool is a third page, under dist/takeoff. It has its
      # own package.json, and its Vite config writes into this dist/ directly.
      # Same ordering rule as the analyzer: after `npm run build`.
      - run: npm ci
        working-directory: takeoff
      - run: npm run build
        working-directory: takeoff

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
