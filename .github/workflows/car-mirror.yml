name: car-mirror app

# Path-filtered like the other products' workflows, so nothing outside
# car-mirror/ runs this. It builds on pushes to any branch (not only main)
# because each build publishes the installable APK as a release; a branch
# build is marked pre-release.
on:
  push:
    paths:
      - 'car-mirror/**'
      - '.github/workflows/car-mirror.yml'
  workflow_dispatch:

permissions:
  contents: write # publishing the APK as a release

concurrency:
  group: car-mirror-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: car-mirror

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Set once the Google Play upload key is added as repo secrets; see car-mirror/README.md.
      HAS_UPLOAD_KEY: ${{ secrets.CAR_MIRROR_UPLOAD_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Frame hub, HTTP server, address rules. Plain JVM, no Android SDK.
      - run: ./gradlew -PcoreOnly :core:test --console=plain

      # The page the car's browser loads, driven in Chromium against a fake
      # phone: draws frames, letterboxes, recovers from a dropped connection,
      # sends taps and swipes to the right spot, blanks while paused, and makes
      # no request off the phone. See tools/viewer-smoke.cjs.
      - name: Viewer page in Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
          CONTROL="$PWD/build/smoke-control"
          ./gradlew -PcoreOnly :core:demoServer --args="8090 --control $CONTROL" --console=plain > demo.log 2>&1 &
          DEMO=$!
          for i in $(seq 1 180); do grep -q READY demo.log && break; sleep 1; done
          node tools/viewer-smoke.cjs http://127.0.0.1:8090/ --control "$CONTROL" || { cat demo.log; exit 1; }
          kill $DEMO || true

      - run: ./gradlew :app:assembleRelease -PbuildNumber=${{ github.run_number }} --console=plain

      - run: cp app/build/outputs/apk/release/app-release.apk car-mirror-${{ github.run_number }}.apk

      # Opens the real phone screen in Robolectric in each state (ready, waiting, paused,
      # light and dark), checks the right controls show, and saves a picture of each.
      # The pictures go on the release as preview-*.png.
      - name: Phone screen previews
        run: |
          ./gradlew :app:testDebugUnitTest --console=plain
          for f in app/build/screenshots/*.png; do
            name=$(basename "$f")
            case "$name" in
              store-*) cp "$f" "$name" ;;          # 1080x1920 Play Store screenshots
              *) cp "$f" "preview-$name" ;;        # full-page previews for review
            esac
          done
          ls -l preview-*.png store-*.png

      # Everything a store listing needs, zipped onto the release: captioned screenshots made
      # from this build's store-*.png, the icon and banner, the listing text one file per box,
      # the Play Console answers and the submission checklist.
      - name: Store kit
        run: |
          sudo apt-get install -y fonts-inter > /dev/null || echo "fonts-inter unavailable: captions use a fallback font"
          node tools/store-kit.cjs --shots . --out store-kit
          (cd store-kit && zip -qr ../car-mirror-store-kit-${{ github.run_number }}.zip .)
          cp store-kit/screenshots/listing-*.png .
          ls -l car-mirror-store-kit-*.zip listing-*.png

      # The bundle Google Play takes and an APK for the Galaxy Store, both signed with the
      # private upload key rather than the shared one. Workflow artifacts only, never attached
      # to the public release.
      - name: Store builds
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.CAR_MIRROR_UPLOAD_KEYSTORE }}
          CAR_MIRROR_UPLOAD_PASSWORD: ${{ secrets.CAR_MIRROR_UPLOAD_PASSWORD }}
        run: |
          export CAR_MIRROR_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.keystore"
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$CAR_MIRROR_UPLOAD_KEYSTORE"
          ./gradlew :app:bundleRelease -PplayUpload -PbuildNumber=${{ github.run_number }} --console=plain
          cp app/build/outputs/bundle/release/app-release.aab car-mirror-${{ github.run_number }}.aab
          ./gradlew :app:assembleRelease -PplayUpload -PbuildNumber=${{ github.run_number }} --console=plain
          cp app/build/outputs/apk/release/app-release.apk car-mirror-${{ github.run_number }}-galaxy.apk
          rm -f "$CAR_MIRROR_UPLOAD_KEYSTORE"

      # Paths below are repo-root relative: `defaults.run` does not apply to `uses:` steps.
      - uses: actions/upload-artifact@v4
        with:
          name: car-mirror-apk
          path: car-mirror/car-mirror-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          name: car-mirror-store-builds
          path: |
            car-mirror/car-mirror-*.aab
            car-mirror/car-mirror-*-galaxy.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: car-mirror-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Car Mirror build ${{ github.run_number }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          files: |
            car-mirror/car-mirror-${{ github.run_number }}.apk
            car-mirror/preview-*.png
            car-mirror/store-*.png
            car-mirror/listing-*.png
            car-mirror/car-mirror-store-kit-*.zip
          body: |
            Open this page on your Android phone and tap **car-mirror-${{ github.run_number }}.apk** below to install it.
            Installing over an earlier build keeps your settings. Setup steps: car-mirror/README.md.
            The preview-*.png files show what each screen of this build looks like. To sell it,
            download **car-mirror-store-kit-${{ github.run_number }}.zip**: captioned listing
            screenshots (listing-*.png, also attached here), icon, banner, listing text and a
            step-by-step checklist.

            Built from ${{ github.sha }} on `${{ github.ref_name }}`.
